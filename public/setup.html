<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klassenportal – Ersteinrichtung</title><link rel="stylesheet" href="/styles.css"></head><body><main class="center"><form class="login" id="setup"><div class="brand">Klassenportal – Ersteinrichtung</div><p class="muted">Einmalig den Plattform-Admin anlegen. Das Bootstrap-Geheimnis wird nur direkt an deinen Cloudflare-Worker gesendet.</p><label class="field">BOOTSTRAP_SECRET<input name="secret" type="password" autocomplete="off" required></label><label class="field">Admin-E-Mail<input name="email" type="email" required></label><label class="field">Admin-Name<input name="display_name" required></label><label class="field">Neues Admin-Passwort<input name="password" type="password" minlength="10" required></label><button class="btn" type="submit">Plattform-Admin anlegen</button><p id="msg" class="muted"></p></form></main><script>const f=document.getElementById('setup'),m=document.getElementById('msg');f.addEventListener('submit',async e=>{e.preventDefault();m.textContent='Wird angelegt …';const d=Object.fromEntries(new FormData(f));try{const r=await fetch('/api/bootstrap',{method:'POST',headers:{'content-type':'application/json','x-bootstrap-secret':d.secret},body:JSON.stringify({email:d.email,password:d.password,display_name:d.display_name})});const j=await r.json();if(!r.ok)throw new Error(j.error||('HTTP '+r.status));m.className='ok';m.textContent='Fertig. Plattform-Admin wurde angelegt. Du kannst dich jetzt auf der Startseite anmelden.';f.querySelector('button').disabled=true;}catch(x){m.className='error';m.textContent=x.message;}});</script></body></html>
