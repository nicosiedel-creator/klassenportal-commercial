<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="theme-color" content="#172033"><title>Klassenportal · Partnerzugang</title><link rel="stylesheet" href="/styles.css?v=20260816-14"><style>body{margin:0;background:#f6f8fb;color:#172033;font-family:system-ui,sans-serif}.partner-wrap{max-width:920px;margin:0 auto;padding:30px 18px}.partner-card{background:#fff;border:1px solid #dbe3ee;border-radius:18px;padding:22px;box-shadow:0 10px 28px #0001}.partner-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.partner-box{border:1px solid #e5e7eb;border-radius:12px;padding:12px}.partner-list{display:grid;gap:8px}.partner-row{padding:9px;border-bottom:1px solid #eef2f7}.partner-token{display:grid;gap:8px}.partner-token input{padding:10px;font:inherit}.partner-token button{padding:10px 14px}.muted{color:#5c697c}.error{background:#fff1f2;color:#9f1239;padding:10px;border-radius:10px}</style></head><body><main class="partner-wrap"><section class="partner-card"><h1>Geschützter Partnerzugang</h1><p class="muted">Sie sehen ausschließlich die Daten, die der Bildungsträger für diesen zeitlich begrenzten Zugang freigegeben hat.</p><div id="partner-app"><form class="partner-token" id="partner-token-form"><label>Zugangstoken<input id="partner-token" autocomplete="off" required></label><button type="submit">Zugang öffnen</button></form></div></section></main><script type="module" src="/partner-portal.js?v=20260820-1"></script></body></html>
