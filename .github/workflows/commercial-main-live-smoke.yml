name: Commercial main live smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commercial-main-live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE: https://klassenportal.app
      WORKER_BASE: https://klassenportal-commercial.nicosiedel.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact deployed Worker
        shell: bash
        run: |
          set -euo pipefail
          # The production Workers Build is not just a deploy: it installs, runs the full
          # regression suite, the release checks, the local D1 migrations, the EU D1 cutover and
          # the remote D1 migrations before Wrangler publishes. That pipeline routinely needs well
          # over ten minutes, so a shorter budget here fails a release that is in fact healthy.
          # Budget generously and report how long we actually waited when it really does not land.
          marker="<meta name=\"kp-build-commit\" content=\"$GITHUB_SHA\">"
          deadline=$(( SECONDS + 30 * 60 ))
          probe=0
          while (( SECONDS < deadline )); do
            probe=$(( probe + 1 ))
            home=$(curl -fsS --max-time 12 "$WORKER_BASE/?sha=$GITHUB_SHA&probe=$probe" || true)
            if grep -Fq "$marker" <<<"$home"; then
              echo "Exact Commercial Worker deployment is live after ${SECONDS}s: $GITHUB_SHA"
              exit 0
            fi
            if (( probe % 12 == 0 )); then echo "Still waiting for $GITHUB_SHA after ${SECONDS}s ..."; fi
            sleep 10
          done
          echo "Exact Commercial Worker deployment marker was not observed within ${SECONDS}s." >&2
          echo "Check the Workers Build for this commit before re-running this workflow." >&2
          exit 1
      - name: Verify EU D1 and release contracts on deployed Worker
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 15 -o /tmp/legal -w '%{http_code}' "$WORKER_BASE/api/public/legal")
          test "$code" = 200 || { echo "EU D1-backed public legal route returned $code" >&2; cat /tmp/legal >&2; exit 1; }
          jq -e '.ok == true and (.legal | type == "object")' /tmp/legal >/dev/null

          code=$(curl -sS --max-time 15 -o /tmp/admin -w '%{http_code}' "$WORKER_BASE/plattform-admin")
          test "$code" = 200 || { echo "/plattform-admin returned $code" >&2; head -c 300 /tmp/admin >&2; exit 1; }
          for path in /produkt /kunden-admin /dozentenportal; do
            code=$(curl -sS --max-time 15 -o /tmp/body -w '%{http_code}' "$WORKER_BASE$path")
            test "$code" = 503 || { echo "$path must remain locked on the verification host, got $code" >&2; head -c 300 /tmp/body >&2; exit 1; }
          done

          code=$(curl -sS --max-time 15 -o /tmp/platform -w '%{http_code}' "$WORKER_BASE/api/platform/onboarding-invitations")
          case "$code" in 401|403) ;; *) echo "Platform onboarding route returned unexpected $code" >&2; cat /tmp/platform >&2; exit 1;; esac
          code=$(curl -sS --max-time 15 -o /tmp/public -w '%{http_code}' "$WORKER_BASE/api/onboarding/not-a-real-token")
          test "$code" = 503 || { echo "Public onboarding route must remain release-locked, got $code" >&2; cat /tmp/public >&2; exit 1; }

          code=$(curl -sS --max-time 15 -o /tmp/checkout -w '%{http_code}' "$WORKER_BASE/api/payments/checkout-status?session_id=cs_test_release_freeze")
          test "$code" = 503 || { echo "Checkout route must be frozen, got $code" >&2; cat /tmp/checkout >&2; exit 1; }
          jq -e '.ok == false and .error == "PAYMENT_DISABLED"' /tmp/checkout >/dev/null
          code=$(curl -sS --max-time 15 -o /tmp/webhook -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$WORKER_BASE/api/payments/stripe/webhook")
          test "$code" = 200 || { echo "Frozen webhook acknowledgement returned $code" >&2; cat /tmp/webhook >&2; exit 1; }
          jq -e '.ok == true and .ignored == true and .paymentProcessing == "disabled"' /tmp/webhook >/dev/null
          echo 'Deployed Worker EU-D1, release-lock, onboarding and payment-freeze contracts: OK'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify exact custom-domain deployment through Chromium
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const expected=process.env.GITHUB_SHA;
          const base=process.env.BASE;
          const browser=await chromium.launch({headless:true,args:['--disable-blink-features=AutomationControlled']});
          try{
            const context=await browser.newContext({
              locale:'de-DE',
              userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36',
              viewport:{width:1440,height:1000},
            });
            const page=await context.newPage();
            const response=await page.goto(`${base}/?release_smoke=${expected}`,{waitUntil:'domcontentloaded',timeout:60000});
            if(!response||response.status()!==200)throw new Error(`CUSTOM_DOMAIN_ROOT_STATUS_${response?.status()??'NONE'}`);
            const marker=await page.locator('meta[name="kp-build-commit"]').getAttribute('content');
            if(marker!==expected)throw new Error(`CUSTOM_DOMAIN_COMMIT_MISMATCH:${marker||'MISSING'}:${expected}`);
            if(!/Klassenportal Commercial/i.test(await page.title()))throw new Error('CUSTOM_DOMAIN_TITLE_MISMATCH');
            console.log(`Exact custom-domain deployment is live: ${expected}`);
          }finally{
            await browser.close();
          }
          NODE
