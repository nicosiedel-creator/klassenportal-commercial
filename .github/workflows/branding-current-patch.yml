name: Apply current branding value patch
on:
  push:
    branches:
      - branding-theme-studio
    paths:
      - patches/fix-branding-current.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branding-theme-studio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python patches/fix-branding-current.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/app.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Preserve complete current tenant branding in editor"
          git push origin HEAD:branding-theme-studio
