name: Education OS release gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: education-os-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Full regression suite
        run: npm test
      - name: Browser JavaScript syntax
        run: find public -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Release readiness
        run: node scripts/release-check.mjs
      - name: Apply all D1 migrations locally
        run: npx wrangler d1 migrations apply DB --local
