name: Diagnostic production D1 onboarding schema

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read schema-only diagnostic preview
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://onbdiag-klassenportal-commercial.nicosiedel.workers.dev/api/public/legal'
            'https://f95dddbb-klassenportal-commercial.nicosiedel.workers.dev/api/public/legal'
          )
          for url in "${urls[@]}"; do
            echo "PROBE:$url"
            for i in $(seq 1 8); do
              code=$(curl -sS --max-time 12 -o /tmp/legal.json -w '%{http_code}' "$url?diag=$i" || true)
              echo "HTTP:$code"
              if test "$code" = 200 && jq -e '.legal.__onboardingSchemaDiagnostic.schema | type == "object"' /tmp/legal.json >/dev/null 2>&1; then
                jq '.legal.__onboardingSchemaDiagnostic' /tmp/legal.json
                exit 0
              fi
              head -c 300 /tmp/legal.json || true
              echo
              sleep 3
            done
          done
          echo 'Schema diagnostic preview unavailable.' >&2
          exit 1
