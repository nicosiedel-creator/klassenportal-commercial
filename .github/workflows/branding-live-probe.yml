name: Branding live probe
on:
  push:
    branches: [branding-live-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Cloudflare branch previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidates=(
            commercial-preview
            block3-onboarding-managed-setup
            branding-runtime-schema-safety
            branding-theme-studio
            verify-branding-live-smoke
            branding-live-probe
          )
          result='[]'
          for branch in "${candidates[@]}"; do
            base="https://${branch}-klassenportal-commercial.nicosiedel.workers.dev"
            code=$(curl -sS --max-time 15 -o /tmp/branding -w '%{http_code}' "$base/branding-assistant.js?probe=$GITHUB_SHA" || true)
            meta_code=$(curl -sS --max-time 15 -o /tmp/meta -w '%{http_code}' "$base/public/bildungszentrum-spreeblick-demo/fisi-26-1/meta?probe=$GITHUB_SHA" || true)
            marker_code=$(curl -sS --max-time 15 -o /tmp/marker -w '%{http_code}' "$base/deployment-health.json?probe=$GITHUB_SHA" || true)
            six=false; free=false; accent=false; surface=false; text=false; bg_nonwhite=false; marker=false
            grep -Fq 'Sechs Designvorschläge' /tmp/branding 2>/dev/null && six=true || true
            grep -Fq 'Farben frei zusammenstellen' /tmp/branding 2>/dev/null && free=true || true
            grep -Fq '"accent_color"' /tmp/meta 2>/dev/null && accent=true || true
            grep -Fq '"surface_color"' /tmp/meta 2>/dev/null && surface=true || true
            grep -Fq '"text_color"' /tmp/meta 2>/dev/null && text=true || true
            grep -Fq '2026-08-17-branding-runtime-schema' /tmp/marker 2>/dev/null && marker=true || true
            if grep -Fq '"background_color":"#ffffff"' /tmp/meta 2>/dev/null; then bg_nonwhite=false; elif [ "$meta_code" = 200 ]; then bg_nonwhite=true; fi
            ok=false
            if [ "$code" = 200 ] && [ "$meta_code" = 200 ] && [ "$six" = true ] && [ "$free" = true ] && [ "$accent" = true ] && [ "$surface" = true ] && [ "$text" = true ] && [ "$bg_nonwhite" = true ]; then ok=true; fi
            if { [ "$branch" = block3-onboarding-managed-setup ] || [ "$branch" = commercial-preview ]; } && { [ "$marker_code" != 200 ] || [ "$marker" != true ]; }; then ok=false; fi
            item=$(jq -nc --arg branch "$branch" --arg base "$base" --arg code "$code" --arg meta "$meta_code" --arg marker_code "$marker_code" --argjson six "$six" --argjson free "$free" --argjson accent "$accent" --argjson surface "$surface" --argjson text "$text" --argjson bg "$bg_nonwhite" --argjson marker "$marker" --argjson ok "$ok" '{branch:$branch,base:$base,http:{branding:$code,meta:$meta,marker:$marker_code},markers:{six:$six,free:$free,accent:$accent,surface:$surface,text:$text,nonwhite:$bg,deployment_marker:$marker},ok:$ok}')
            result=$(jq -nc --argjson a "$result" --argjson i "$item" '$a+[$i]')
          done
          payload=$(jq -nc --arg sha "$GITHUB_SHA" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson results "$result" '{probe_sha:$sha,probed_at:$at,results:$results}')
          encoded=$(printf '%s\n' "$payload" | base64 -w0)
          meta=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/ci/branding-live-probe.json?ref=branding-live-probe-status")
          current_sha=$(jq -r '.sha' <<<"$meta")
          jq -n --arg message "Record branch preview probe" --arg content "$encoded" --arg sha "$current_sha" --arg branch branding-live-probe-status '{message:$message,content:$content,sha:$sha,branch:$branch}' >/tmp/update.json
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/ci/branding-live-probe.json" --data-binary @/tmp/update.json >/dev/null
