name: Commercial browser E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: ['release-check/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project and Playwright Chromium
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Diagnose real custom-domain onboarding POST edge
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const base='https://klassenportal.app';
          const invalid='/api/onboarding/production-edge-diagnostic-invalid-token-20260827';
          const browser=await chromium.launch({headless:true,args:['--disable-blink-features=AutomationControlled']});
          try{
            const context=await browser.newContext({
              locale:'de-DE',
              userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36',
              viewport:{width:1440,height:1000},
            });
            const page=await context.newPage();
            const root=await page.goto(base+'/?onboarding_edge_probe=1',{waitUntil:'domcontentloaded',timeout:60000});
            if(!root||root.status()!==200)throw new Error(`CUSTOM_DOMAIN_ROOT_STATUS_${root?.status()??'NONE'}`);
            const result=await page.evaluate(async path=>{
              const response=await fetch(path,{
                method:'POST',
                credentials:'same-origin',
                cache:'no-store',
                headers:{'content-type':'application/json'},
                body:JSON.stringify({}),
              });
              const text=await response.text();
              return {
                status:response.status,
                contentType:response.headers.get('content-type'),
                cfMitigated:response.headers.get('cf-mitigated'),
                server:response.headers.get('server'),
                body:text.slice(0,500),
              };
            },invalid);
            console.log('CUSTOM_DOMAIN_ONBOARDING_POST_DIAGNOSTIC='+JSON.stringify(result));
            if(result.cfMitigated==='challenge')throw new Error('CUSTOM_DOMAIN_ONBOARDING_POST_WAF_CHALLENGED');
            if(!String(result.contentType||'').toLowerCase().includes('application/json'))throw new Error(`CUSTOM_DOMAIN_ONBOARDING_POST_NON_JSON:${result.status}:${result.contentType||'missing'}`);
            let data=null;try{data=JSON.parse(result.body);}catch{}
            if(!data||typeof data!=='object')throw new Error(`CUSTOM_DOMAIN_ONBOARDING_POST_INVALID_JSON:${result.status}`);
            if(result.status>=500)throw new Error(`CUSTOM_DOMAIN_ONBOARDING_POST_SERVER_ERROR:${result.status}:${data.error||'unknown'}`);
            if(data.error!=='ONBOARDING_NOT_FOUND')throw new Error(`CUSTOM_DOMAIN_ONBOARDING_POST_UNEXPECTED_CONTRACT:${result.status}:${data.error||'missing'}`);
            console.log('Real custom-domain onboarding POST reaches the Worker without a Cloudflare Challenge Page.');
          }finally{
            await browser.close();
          }
          NODE
      - name: Prepare exact local PR candidate and real onboarding fixtures
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const config=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          config.vars={...config.vars,APP_ORIGIN:'http://127.0.0.1:8787',PAYMENTS_ENABLED:'false'};
          delete config.routes;
          writeFileSync('wrangler.browser-e2e.json',JSON.stringify(config,null,2));
          NODE
          npx wrangler d1 migrations apply DB --local --config wrangler.browser-e2e.json
          node scripts/commercial-onboarding-e2e-state.mjs seed wrangler.browser-e2e.json
          WORKERS_CI_GUARD_ACTIVE=1 npx wrangler dev --config wrangler.browser-e2e.json --local --ip 127.0.0.1 --port 8787 --local-upstream 127.0.0.1 --upstream-protocol http >/tmp/commercial-wrangler-e2e.log 2>&1 &
          echo $! >/tmp/commercial-wrangler-e2e.pid
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:8787/plattform-admin >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if test "$ready" != 1; then
            echo 'Local PR candidate did not become ready.' >&2
            cat /tmp/commercial-wrangler-e2e.log >&2 || true
            exit 1
          fi
          echo 'Exact local PR candidate with migrated D1 fixtures is ready.'
      - name: Click through exact Commercial PR candidate
        shell: bash
        env:
          COMMERCIAL_BASE_URL: http://127.0.0.1:8787
          E2E_TARGET_MODE: candidate
        run: |
          set +e
          node scripts/commercial-browser-e2e.mjs 2>&1 | tee /tmp/commercial-browser-e2e.log
          status=${PIPESTATUS[0]}
          {
            echo '### Commercial browser E2E diagnostic'
            echo '```text'
            tail -n 160 /tmp/commercial-browser-e2e.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Verify exact persisted onboarding and payment-freeze state
        shell: bash
        run: node scripts/commercial-onboarding-e2e-state.mjs verify wrangler.browser-e2e.json
      - name: Upload browser E2E diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-browser-e2e-log
          path: |
            /tmp/commercial-browser-e2e.log
            /tmp/commercial-wrangler-e2e.log
          if-no-files-found: error
      - name: Show local Worker log on failure
        if: failure()
        run: cat /tmp/commercial-wrangler-e2e.log || true
      - name: Stop local PR candidate
        if: always()
        run: |
          if test -f /tmp/commercial-wrangler-e2e.pid; then kill "$(cat /tmp/commercial-wrangler-e2e.pid)" 2>/dev/null || true; fi
          rm -f wrangler.browser-e2e.json
