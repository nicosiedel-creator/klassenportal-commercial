name: Secondary portal live smoke
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Preview/production base URL to verify
        required: true
        default: https://block3-onboarding-managed-setup-klassenportal-commercial.nicosiedel.workers.dev
  push:
    branches:
      - block3-onboarding-managed-setup
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static portal UX/privacy and release checks
        run: |
          node scripts/portal-ux-check.mjs
          node scripts/release-check.mjs
      - name: Verify exact deployed Worker and portal/branding schema
        env:
          BASE: ${{ inputs.base_url || 'https://block3-onboarding-managed-setup-klassenportal-commercial.nicosiedel.workers.dev' }}
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 36); do
            build_meta=$(curl -fsS --max-time 12 "$BASE/build-meta.json?sha=$GITHUB_SHA" || true)
            css=$(curl -fsS --max-time 12 "$BASE/vfa13-refinement.css?sha=$GITHUB_SHA" || true)
            theme=$(curl -fsS --max-time 12 "$BASE/branding-theme.css?sha=$GITHUB_SHA" || true)
            js=$(curl -fsS --max-time 12 "$BASE/vfa13-refinement.js?sha=$GITHUB_SHA" || true)
            branding=$(curl -fsS --max-time 12 "$BASE/branding-assistant.js?sha=$GITHUB_SHA" || true)
            privacy=$(curl -fsS --max-time 12 "$BASE/owner-route-privacy.js?sha=$GITHUB_SHA" || true)
            portal=$(curl -fsS --max-time 12 "$BASE/portal/bildungszentrum-spreeblick-demo/fisi-26-1?sha=$GITHUB_SHA" || true)
            portal_meta=$(curl -fsS --max-time 12 "$BASE/public/bildungszentrum-spreeblick-demo/fisi-26-1/meta?sha=$GITHUB_SHA" || true)
            customer=$(curl -fsS --max-time 12 "$BASE/kunden-admin?sha=$GITHUB_SHA" || true)
            exact_sha=0
            if jq -e --arg sha "$GITHUB_SHA" '.commit == $sha' <<<"$build_meta" >/dev/null 2>&1; then
              exact_sha=1
            fi
            if test "$exact_sha" = 1 \
              && grep -q -- '--kp-content-max:1320px' <<<"$css" \
              && grep -Fq '.portal-header-actions>a.portal-btn.secondary{visibility:hidden!important}' <<<"$css" \
              && grep -q -- '--portal-surface' <<<"$theme" \
              && grep -q -- '--portal-bg,#ece8df' <<<"$theme" \
              && grep -q 'Kacheln anpassen' <<<"$js" \
              && grep -Fq "management.dataset.roleLink='1'" <<<"$js" \
              && grep -q 'Sechs Designvorschläge' <<<"$branding" \
              && grep -q 'Farben frei zusammenstellen' <<<"$branding" \
              && grep -q 'plattform-admin' <<<"$privacy" \
              && grep -q '/branding-theme.css' <<<"$portal" \
              && grep -q '/owner-route-privacy.js' <<<"$customer" \
              && grep -q '"accent_color"' <<<"$portal_meta" \
              && grep -q '"surface_color"' <<<"$portal_meta" \
              && grep -q '"text_color"' <<<"$portal_meta"; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1
      - name: Persist successful live verification
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          payload=$(jq -nc --arg status success --arg sha "$GITHUB_SHA" --arg at "$verified_at" '{status:$status,verified_sha:$sha,verified_at:$at}')
          encoded=$(printf '%s\n' "$payload" | base64 -w0)
          meta=$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/ci/portal-live-smoke.json?ref=portal-verification-status")
          current_sha=$(jq -r '.sha' <<<"$meta")
          jq -n --arg message "Record portal live smoke for $GITHUB_SHA" --arg content "$encoded" --arg sha "$current_sha" --arg branch portal-verification-status '{message:$message,content:$content,sha:$sha,branch:$branch}' > /tmp/status.json
          curl -fsS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/ci/portal-live-smoke.json" \
            --data-binary @/tmp/status.json >/dev/null
