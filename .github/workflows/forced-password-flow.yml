name: Secondary forced password flow check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/auth-mfa-ui.js'
      - 'public/boot.js'
      - 'scripts/forced-password-flow-check.mjs'
      - '.github/workflows/forced-password-flow.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/forced-password-flow-check.mjs
