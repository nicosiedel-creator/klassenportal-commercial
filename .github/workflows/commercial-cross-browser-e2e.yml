name: Commercial cross-browser E2E

# Firefox und WebKit fahren denselben Ablauf wie der Chromium-Gate.
#
# Stand der WebKit-Untersuchung: WebKit erreicht auf den GitHub-Runnern den lokalen Server
# nicht. Die Diagnose im Lauf meldet jedes Mal dasselbe - "about:blank: ok in 7-9ms |
# eingebautes Dokument: ok in 10-21ms | node erreicht den Server: 200 | Navigation über IP:
# Timeout | Navigation über localhost: Timeout" - und im Worker-Protokoll kommt keine einzige
# Anfrage von WebKit an. Ausgeschlossen sind damit: eine kaputte Installation (die Engine
# rendert in einstelligen Millisekunden), das Runner-Abbild (identisch auf ubuntu-latest und
# ubuntu-24.04), die Adressform (127.0.0.1 und localhost laufen beide in die
# Zeitueberschreitung), die Erreichbarkeit des Servers (node bekommt 200, und die
# Bereitschaftspruefung verlangt vorher fuenf Antworten in Folge) und die Playwright-Fassung
# (1.55.0 und 1.62.1 verhalten sich gleich). Firefox faehrt denselben Ablauf auf demselben
# Runner gegen denselben Server vollstaendig durch. Es ist also kein Befund am Portal - es
# erreicht das Portal nichts. Wer hier weitersucht, faengt bei der Netzschicht dieser
# WebKit-Fassung unter Linux an, nicht bei den vier oben ausgeschlossenen Ursachen.
#
# Der Workflow läuft absichtlich nicht bei jedem Pull Request: Er ist neu, seine Befunde sind noch unbekannt,
# und browserabhängige Fehler sollen gefunden und behoben werden, ohne einen gesunden
# Release aufzuhalten. Sobald er stabil grün läuft, kann er auf pull_request erweitert
# und zum Pflicht-Gate gemacht werden.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: commercial-cross-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-browser:
    # ubuntu-latest ist inzwischen ein Abbild, auf dem WebKit zwar rendert - about:blank in 7ms,
    # ein eingebautes Dokument in 21ms - aber den lokalen Server ueber keine Adressform erreicht:
    # Navigation ueber 127.0.0.1 und ueber localhost laufen beide in die Zeitueberschreitung,
    # waehrend node im selben Lauf 200 bekommt und Firefox denselben Ablauf durchlaeuft. Es
    # kommt keine einzige Anfrage im Worker-Protokoll an. Das ist kein Befund am Portal, sondern
    # die Netzschicht dieser WebKit-Fassung auf diesem Abbild. Ein festes, aelteres Abbild fuer
    # beide Engines, damit sie vergleichbar bleiben.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project and ${{ matrix.browser }}
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      # WebKit schickte auf dem Runner in 90 Sekunden keine einzige Anfrage an den lokalen
      # Server, waehrend Firefox denselben Ablauf durchlief. Ob die Engine ueberhaupt startet
      # und zu welchem Abbild sie passt, gehoert deshalb ins Protokoll - sonst raet man.
      - name: Report runner image and engine build
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release && echo "Runner: $PRETTY_NAME"
          node -e "console.log('playwright',require('playwright/package.json').version)"
          node --input-type=module -e "
          import { ${{ matrix.browser }} } from 'playwright';
          const browser=await ${{ matrix.browser }}.launch({headless:true});
          console.log('${{ matrix.browser }}', browser.version());
          const page=await browser.newPage();
          const started=Date.now();
          await page.goto('data:text/html,<title>x</title><p>x',{waitUntil:'domcontentloaded',timeout:20000});
          console.log('eingebautes Dokument geladen in', Date.now()-started, 'ms');
          await browser.close();
          "
      # Bis hierher endete die Untersuchung bei "es kommt nichts an". Diese Messung trennt zum
      # ersten Mal Engine von Portal: ein winziger HTTP-Server aus node, ein zufaelliger Port auf
      # 127.0.0.1, kein Wrangler, kein Portal - und drei Antworten, die bisher fehlten: sieht der
      # Server die Anfrage ueberhaupt, wie nennt die Engine den Netzfehler, und haelt sie sich
      # ueberhaupt fuer verbunden.
      #
      # Ergebnis der ersten Messung (Lauf 33319723183, Ubuntu 24.04.4, WebKit 26.0): die Engine
      # erreicht einen lokalen node-Server in 37 ms mit Status 200 - vor UND nach dem Loesen der
      # Benutzernamensraum-Sperre gleichermassen, obwohl die Sperre gesetzt war. Damit ist der
      # naechstliegende Verdacht widerlegt und die Netzschicht von WebKit unter Linux als Ursache
      # ausgeschlossen. Der Schritt zum Loesen der Sperre bleibt nur als Vergleichspunkt stehen.
      #
      # Was bleibt: die Abnahme oeffnet ihre Seite anders als diese Messung - mit Fenstergroesse,
      # Sprache und eigener Browserkennung. Die Messung faehrt dieselbe Navigation jetzt einmal
      # je Einstellung. Welche Zeile in die Zeitueberschreitung laeuft, benennt die Ursache.
      - name: Measure local reachability for ${{ matrix.browser }} as found
        shell: bash
        run: |
          set -uo pipefail
          echo '--- wie vorgefunden ---' | tee /tmp/netzprobe.log
          . /etc/os-release && echo "Runner: $PRETTY_NAME" | tee -a /tmp/netzprobe.log
          echo "apparmor_restrict_unprivileged_userns=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 'nicht vorhanden')" | tee -a /tmp/netzprobe.log
          if unshare --user --map-root-user true 2>/dev/null; then echo "unprivilegierte Benutzernamensraeume: nutzbar" | tee -a /tmp/netzprobe.log; else echo "unprivilegierte Benutzernamensraeume: BLOCKIERT" | tee -a /tmp/netzprobe.log; fi
          node scripts/browser-local-network-probe.mjs ${{ matrix.browser }} 2>&1 | tee -a /tmp/netzprobe.log || true
      - name: Release the user-namespace restriction on this runner
        shell: bash
        run: |
          set -uo pipefail
          current=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)
          if [ "$current" = "1" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "Sperre liess sich nicht loesen"
          else
            echo "Keine Sperre gesetzt - nichts zu loesen."
          fi
      - name: Measure local reachability for ${{ matrix.browser }} again
        shell: bash
        run: |
          set -uo pipefail
          echo '--- nach dem Loesen der Sperre ---' | tee -a /tmp/netzprobe.log
          node scripts/browser-local-network-probe.mjs ${{ matrix.browser }} 2>&1 | tee -a /tmp/netzprobe.log || true
          {
            echo "### Netzprobe ${{ matrix.browser }}"
            echo '```text'
            cat /tmp/netzprobe.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare exact local PR candidate and real onboarding fixtures
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const config=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          config.vars={...config.vars,APP_ORIGIN:'http://127.0.0.1:8787',PAYMENTS_ENABLED:'false'};
          delete config.routes;
          writeFileSync('wrangler.browser-e2e.json',JSON.stringify(config,null,2));
          NODE
          npx wrangler d1 migrations apply DB --local --config wrangler.browser-e2e.json
          node scripts/commercial-onboarding-e2e-state.mjs seed wrangler.browser-e2e.json
          WORKERS_CI_GUARD_ACTIVE=1 npx wrangler dev --config wrangler.browser-e2e.json --local --ip 127.0.0.1 --port 8787 --local-upstream 127.0.0.1 --upstream-protocol http >/tmp/commercial-wrangler-e2e.log 2>&1 &
          echo $! >/tmp/commercial-wrangler-e2e.pid
          node scripts/wait-for-local-candidate.mjs http://127.0.0.1:8787/plattform-admin /tmp/commercial-wrangler-e2e.log
      # Die entscheidende Trennung. Bis hierher ist belegt: die Engine erreicht einen lokalen
      # node-Server in Millisekunden, mit und ohne Benutzernamensraum-Sperre, schlicht und mit
      # genau den Einstellungen der Abnahme. Sie erreicht nur diesen einen Server nicht.
      # Diese Messung faehrt deshalb beides in derselben Sekunde: den eigenen node-Server und den
      # laufenden Kandidaten. Und sie zaehlt mit, ob die Engine die Anfrage ueberhaupt abschickt.
      - name: Measure the running candidate against a plain server
        shell: bash
        run: |
          set -uo pipefail
          echo '--- gegen den laufenden Kandidaten ---' | tee -a /tmp/netzprobe.log
          node scripts/browser-local-network-probe.mjs ${{ matrix.browser }} --url http://127.0.0.1:8787/plattform-admin 2>&1 | tee -a /tmp/netzprobe.log || true
      - name: Click through the candidate in ${{ matrix.browser }}
        shell: bash
        env:
          COMMERCIAL_BASE_URL: http://127.0.0.1:8787
          E2E_TARGET_MODE: candidate
          E2E_BROWSER: ${{ matrix.browser }}
        run: |
          set +e
          node scripts/commercial-browser-e2e.mjs 2>&1 | tee /tmp/commercial-browser-e2e.log
          status=${PIPESTATUS[0]}
          {
            echo "### Commercial ${E2E_BROWSER} E2E diagnostic"
            echo '```text'
            tail -n 160 /tmp/commercial-browser-e2e.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Verify exact persisted onboarding and payment-freeze state
        shell: bash
        run: node scripts/commercial-onboarding-e2e-state.mjs verify wrangler.browser-e2e.json
      - name: Upload diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-${{ matrix.browser }}-e2e-log
          path: |
            /tmp/commercial-browser-e2e.log
            /tmp/commercial-wrangler-e2e.log
          if-no-files-found: warn
      # Der Wrangler-Mitschnitt ist lang und stand bisher am Ende des Job-Logs - er verdrängte
      # damit genau die Zeile, die sagt, woran der Lauf gescheitert ist. Erst ein knapper
      # Auszug, dann noch einmal der Befund, damit er die letzte Zeile des Logs ist.
      - name: Show local Worker log on failure
        if: failure()
        run: tail -n 40 /tmp/commercial-wrangler-e2e.log || true
      - name: Repeat the failure at the end of the log
        if: failure()
        run: |
          echo '--- Netzprobe (Messung vor dem eigentlichen Lauf) ---'
          cat /tmp/netzprobe.log || true
          echo '--- Browser-E2E: letzte Zeilen ---'
          tail -n 40 /tmp/commercial-browser-e2e.log || true
      - name: Stop local PR candidate
        if: always()
        run: |
          if test -f /tmp/commercial-wrangler-e2e.pid; then kill "$(cat /tmp/commercial-wrangler-e2e.pid)" 2>/dev/null || true; fi
          rm -f wrangler.browser-e2e.json
