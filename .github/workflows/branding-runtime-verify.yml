name: Branding runtime verify
on:
  push:
    branches: [branding-runtime-schema-safety]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        id: install
        run: npm install --no-audit --no-fund
      - name: TypeScript build
        id: build
        run: npm run build
      - name: Browser JS syntax
        id: js
        run: find public -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Automated tests
        id: tests
        run: npm test
      - name: Release readiness
        id: release
        run: node scripts/release-check.mjs
      - name: Local D1 migrations
        id: d1
        run: npx wrangler d1 migrations apply DB --local
      - name: Persist result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_STATUS: ${{ job.status }}
          INSTALL: ${{ steps.install.outcome }}
          BUILD: ${{ steps.build.outcome }}
          JS: ${{ steps.js.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          RELEASE: ${{ steps.release.outcome }}
          D1: ${{ steps.d1.outcome }}
        run: |
          set -euo pipefail
          verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          payload=$(jq -nc --arg status "$VERIFY_STATUS" --arg sha "$GITHUB_SHA" --arg at "$verified_at" --arg install "$INSTALL" --arg build "$BUILD" --arg js "$JS" --arg tests "$TESTS" --arg release "$RELEASE" --arg d1 "$D1" '{status:$status,verified_sha:$sha,verified_at:$at,steps:{install:$install,build:$build,js:$js,tests:$tests,release:$release,d1:$d1}}')
          encoded=$(printf '%s\n' "$payload" | base64 -w0)
          meta=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/ci/branding-runtime.json?ref=branding-runtime-verification-status")
          current_sha=$(jq -r '.sha' <<<"$meta")
          jq -n --arg message "Record branding runtime verification for $GITHUB_SHA" --arg content "$encoded" --arg sha "$current_sha" --arg branch branding-runtime-verification-status '{message:$message,content:$content,sha:$sha,branch:$branch}' > /tmp/status.json
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/ci/branding-runtime.json" --data-binary @/tmp/status.json >/dev/null
