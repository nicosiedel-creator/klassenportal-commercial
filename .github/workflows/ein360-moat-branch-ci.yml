name: EIN360 Moat Branch CI

on:
  push:
    branches: [feature/ein360-moat-20260820]
    paths-ignore:
      - '.github/ci-results/**'

permissions:
  contents: write

concurrency:
  group: ein360-moat-branch-ci
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run complete gates and persist branch-only report
        shell: bash
        run: |
          set +e
          mkdir -p .github/ci-results
          REPORT=.github/ci-results/ein360-moat-latest.txt
          : > "$REPORT"
          printf 'commit=%s\nstarted_utc=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$REPORT"
          OVERALL=0
          run_gate() {
            NAME="$1"; shift
            TMP="$(mktemp)"
            "$@" >"$TMP" 2>&1
            CODE=$?
            printf '\n=== %s ===\nexit=%s\n' "$NAME" "$CODE" >> "$REPORT"
            tail -n 120 "$TMP" >> "$REPORT"
            rm -f "$TMP"
            if [ "$CODE" -ne 0 ]; then OVERALL=1; fi
          }
          run_gate install npm install --no-audit --no-fund
          run_gate typecheck npm run typecheck
          run_gate full_regression npm test
          run_gate browser_js bash -c "find public -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check"
          run_gate release_check node scripts/release-check.mjs
          run_gate d1_migrations npx wrangler d1 migrations apply DB --local
          printf '\noverall=%s\nfinished_utc=%s\n' "$OVERALL" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$REPORT"
          git config user.name 'klassenportal-ci[bot]'
          git config user.email 'klassenportal-ci@users.noreply.github.com'
          git add "$REPORT"
          git commit -m 'ci: record EIN360 moat gate result [skip ci]' || true
          git push origin HEAD:feature/ein360-moat-20260820
          exit "$OVERALL"
