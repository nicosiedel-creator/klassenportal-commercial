name: EIN360 Moat Branch CI

on:
  push:
    branches: [feature/ein360-moat-20260820]

permissions:
  contents: read

concurrency:
  group: ein360-moat-branch-ci
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Full regression suite
        run: npm test
      - name: Validate browser JavaScript syntax
        run: find public -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Release checks
        run: node scripts/release-check.mjs
      - name: Validate all D1 migrations locally
        run: npx wrangler d1 migrations apply DB --local
