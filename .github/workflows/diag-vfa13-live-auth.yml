name: Diagnose VFA13 live auth

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'diag/vfa13-live-auth-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe active VFA13 production deployment and canonical host
        shell: bash
        run: |
          set -euo pipefail
          for base in 'https://0e6fb4b7.vfa13-klassenportal.pages.dev' 'https://vfa13-klassenportal.pages.dev'; do
            echo "##### BASE $base #####"
            for path in '/api/v2/health' '/api/v2/public'; do
              echo "=== $path ==="
              : >/tmp/h; : >/tmp/b
              code=$(curl -sS --max-time 20 -D /tmp/h -o /tmp/b -w '%{http_code}' "$base$path" || true)
              echo "HTTP=$code"
              tr -d '\r' </tmp/h | grep -Ei '^(content-type|x-vfa13-upgrade|cf-ray|server|etag|cache-control):' || true
              head -c 400 /tmp/b; echo; echo
            done
            echo '=== v2-embed.js ==='
            curl -fsS --max-time 20 "$base/v2-embed.js?diag=20260824-0912" -o /tmp/v2.js
            echo "bytes=$(wc -c </tmp/v2.js) sha=$(sha256sum /tmp/v2.js | awk '{print $1}')"
            echo 'release markers:'
            grep -oE '20260824-[0-9]+' /tmp/v2.js | sort -u || true
            echo 'patterns:'
            grep -oE 'pattern="[^"]+"' /tmp/v2.js | head -20 || true
            echo 'minlengths:'
            grep -oE 'minlength="[^"]+"' /tmp/v2.js | sort -u || true
            echo 'auth markers:'
            grep -nE 'auth/challenge|password_proof|password_confirm|validSelfPassword|pattern=' /tmp/v2.js | head -30 || true
            echo
          done
