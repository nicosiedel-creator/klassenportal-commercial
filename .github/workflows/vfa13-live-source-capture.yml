name: Probe VFA13 live redirect chain

on:
  push:
    branches: [vfa13/capture-live-source-20260823]

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vfa13/capture-live-source-20260823
      - name: Probe current production and known previous deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/vfa13-live-capture
          out=tmp/vfa13-live-capture/redirect-probe.txt
          : > "$out"
          for url in \
            'https://vfa13-klassenportal.pages.dev/' \
            'https://vfa13-klassenportal.pages.dev/index.html' \
            'https://vfa13-klassenportal.pages.dev/v2' \
            'https://vfa13-klassenportal.pages.dev/api/calendar?from=2026-08-01&to=2026-09-30' \
            'https://8ec05961.vfa13-klassenportal.pages.dev/' \
            'https://8ec05961.vfa13-klassenportal.pages.dev/api/calendar?from=2026-08-01&to=2026-09-30'; do
            echo "=== $url ===" >> "$out"
            curl -sS --max-time 20 --max-redirs 0 -D - -o /tmp/body "$url" >> "$out" 2>&1 || true
            echo "BODY_BYTES=$(wc -c < /tmp/body 2>/dev/null || echo 0)" >> "$out"
            head -c 180 /tmp/body 2>/dev/null | tr '\n\r\t' '   ' >> "$out" || true
            echo >> "$out"
            echo >> "$out"
          done
          echo '=== FOLLOW PRODUCTION ===' >> "$out"
          curl -sS -L --max-time 25 --max-redirs 12 -D - -o /tmp/follow-body -w '\nFINAL=%{url_effective} CODE=%{http_code} REDIRS=%{num_redirects}\n' 'https://vfa13-klassenportal.pages.dev/' >> "$out" 2>&1 || true
          cat "$out"
      - name: Commit probe result to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/vfa13-live-capture/redirect-probe.txt
          git commit -m 'Record VFA13 redirect probe after upload' || exit 0
          git push origin HEAD:vfa13/capture-live-source-20260823
