name: Temporary Berlin household plan ZIP

on:
  push:
    branches:
      - tmp-haushaltsplan-zip

jobs:
  download:
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        include:
          - { id: '01', name: 'Band_01_Haushaltsgesetz_Gesamtplaene_Uebersichten.pdf', min_size: 4000000, url: 'https://www.berlin.de/sen/finanzen/haushalt/downloads/haushaltsplan-2026-27/band01_2026_2027_hge_uebersichten.pdf?ts=1777462462' }
          - { id: '02', name: 'Band_02_Einzelplaene_01_02_20_21_22.pdf', min_size: 1000000, url: 'https://www.berlin.de/sen/finanzen/haushalt/downloads/haushaltsplan-2026-27/band02_2026_2027_epl-01-02-20-21-22.pdf?ts=1777462467' }
          - { id: '03', name: 'Band_03_Einzelplan_03.pdf', min_size: 1000000, url: 'https://www.berlin.de/sen/finanzen/haushalt/downloads/haushaltsplan-2026-27/band03_2026_2027_epl-03.pdf?ts=1777462460' }
          - { id: '04', name: 'Band_04_Einzelplan_25.pdf', min_size: 2000000, url: 'https://www.berlin.de/sen/finanzen/haushalt/downloads/haushaltsplan-2026-27/band04_2026_2027_epl-25.pdf?ts=1777462465' }
          - { id: '05', name: 'Band_05_Einzelplan_05.pdf', min_size: 5000000, url: 'https://www.berlin.de/sen/finanzen/haushalt/downloads/haushaltsplan-2026-27/band05_2026_2027_epl-05.pdf?ts=1777462474' }
          - { id: '06', name: 'Band_06_Einzelplan_06.pdf', min_size: 4000000, url: 'https://www.berlin.de/sen/finanzen/haushalt/downloads/haushaltsplan-2026-27/band06_2026_2027_epl-06.pdf?ts=1777462488' }
          - { id: '07', name: 'Band_07_Einzelplan_07.pdf', min_size: 5000000, url: 'https://www.berlin.de/sen/finanzen/haushalt/downloads/haushaltsplan-2026-27/band07_2026_2027_epl-07.pdf?ts=1777462458' }
          - { id: '08', name: 'Band_08_Einzelplan_08.pdf', min_size: 5000000, url: 'https://www.berlin.de/sen/finanzen/haushalt/downloads/haushaltsplan-2026-27/band08_2026_2027_epl-08.pdf?ts=1777462479' }
          - { id: '09', name: 'Band_09_Einzelplan_09.pdf', min_size: 4000000, url: 'https://www.berlin.de/sen/finanzen/haushalt/downloads/haushaltsplan-2026-27/band09_2026_2027_epl-09.pdf?ts=1777462482' }
          - { id: '10', name: 'Band_10_Einzelplan_10.pdf', min_size: 5000000, url: 'https://www.berlin.de/sen/finanzen/haushalt/downloads/haushaltsplan-2026-27/band10_2026_2027_epl-10.pdf?ts=1777462484' }
          - { id: '11', name: 'Band_11_Einzelplan_11.pdf', min_size: 4000000, url: 'https://www.berlin.de/sen/finanzen/haushalt/downloads/haushaltsplan-2026-27/band11_2026_2027_epl-11.pdf?ts=1777462475' }
          - { id: '12', name: 'Band_12_Einzelplan_12.pdf', min_size: 3000000, url: 'https://www.berlin.de/sen/finanzen/haushalt/downloads/haushaltsplan-2026-27/band12_2026_2027_epl-12.pdf?ts=1777462471' }
          - { id: '13', name: 'Band_13_Einzelplan_13.pdf', min_size: 3000000, url: 'https://www.berlin.de/sen/finanzen/haushalt/downloads/haushaltsplan-2026-27/band13_2026_2027_epl-13.pdf?ts=1777462478' }
          - { id: '14', name: 'Band_14_Einzelplaene_15_27_29.pdf', min_size: 5000000, url: 'https://www.berlin.de/sen/finanzen/haushalt/haushaltsplan/band14_2026_2027_epl-15-27-29.pdf?ts=1777462487' }
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install and start alternate outbound relay
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tor
          sudo service tor start
          for i in $(seq 1 40); do
            if curl --silent --socks5-hostname 127.0.0.1:9050 --max-time 10 https://check.torproject.org/api/ip >/tmp/relay.json 2>/dev/null; then
              cat /tmp/relay.json
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Download and verify official PDF
        shell: bash
        env:
          URL: ${{ matrix.url }}
          NAME: ${{ matrix.name }}
          MIN_SIZE: ${{ matrix.min_size }}
        run: |
          set -euo pipefail
          mkdir -p out
          ok=0
          for attempt in 1 2 3 4; do
            rm -f "out/$NAME"
            echo "Download attempt $attempt: $NAME"
            if curl --fail --location --silent --show-error \
              --socks5-hostname 127.0.0.1:9050 \
              --connect-timeout 30 --max-time 600 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36' \
              -H 'Accept: application/pdf,*/*' \
              -H 'Referer: https://www.berlin.de/sen/finanzen/haushalt/downloads/haushaltsplan-2026-27/artikel.1644823.php' \
              "$URL" -o "out/$NAME"; then
              if [ "$(head -c 4 "out/$NAME")" = '%PDF' ] && [ "$(stat -c%s "out/$NAME")" -gt "$MIN_SIZE" ]; then
                ok=1
                break
              fi
            fi
            echo 'Changing relay route and retrying...'
            sudo service tor restart
            sleep 8
          done
          test "$ok" -eq 1
          file "out/$NAME"
          ls -lh "out/$NAME"
          sha256sum "out/$NAME"

      - name: Upload verified volume
        uses: actions/upload-artifact@v4
        with:
          name: band-${{ matrix.id }}
          path: out/*.pdf
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  combine:
    needs: download
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all 14 verified volumes
        uses: actions/download-artifact@v4
        with:
          pattern: band-*
          path: combined
          merge-multiple: true

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail
          count=$(find combined -maxdepth 1 -type f -name '*.pdf' | wc -l)
          echo "PDF count: $count"
          test "$count" -eq 14
          for f in combined/*.pdf; do
            test "$(head -c 4 "$f")" = '%PDF'
          done
          ls -lh combined
          sha256sum combined/*.pdf

      - name: Upload final ZIP containing only the PDFs
        uses: actions/upload-artifact@v4
        with:
          name: Berlin_Haushaltsplan_2026_2027_Alle_14_Baende
          path: combined/*.pdf
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
