name: Temporary Berlin household plan ZIP

on:
  push:
    branches:
      - tmp-haushaltsplan-zip

jobs:
  test-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Start alternate outbound relay
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tor
          sudo service tor start
          for i in $(seq 1 30); do
            if curl --silent --show-error --socks5-hostname 127.0.0.1:9050 --max-time 10 https://check.torproject.org/api/ip >/tmp/relay.json 2>/dev/null; then
              cat /tmp/relay.json
              exit 0
            fi
            sleep 2
          done
          echo 'Relay did not become ready'
          exit 1

      - name: Download and verify Band 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          url='https://www.berlin.de/sen/finanzen/haushalt/downloads/haushaltsplan-2026-27/band02_2026_2027_epl-01-02-20-21-22.pdf?ts=1777462467'
          curl --fail --location --silent --show-error \
            --socks5-hostname 127.0.0.1:9050 \
            --retry 4 --retry-delay 4 --retry-all-errors \
            --connect-timeout 30 --max-time 600 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36' \
            -H 'Accept: application/pdf,*/*' \
            -H 'Referer: https://www.berlin.de/sen/finanzen/haushalt/downloads/haushaltsplan-2026-27/artikel.1644823.php' \
            "$url" -o out/Band_02.pdf
          file out/Band_02.pdf
          ls -lh out/Band_02.pdf
          test "$(head -c 4 out/Band_02.pdf)" = '%PDF'
          test "$(stat -c%s out/Band_02.pdf)" -gt 1000000

      - name: Upload verified PDF
        uses: actions/upload-artifact@v4
        with:
          name: relay-band-02
          path: out/Band_02.pdf
          compression-level: 0
          retention-days: 1
