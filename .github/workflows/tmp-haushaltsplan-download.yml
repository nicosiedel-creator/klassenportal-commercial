name: Temporary Berlin household plan ZIP

on:
  push:
    branches:
      - tmp-haushaltsplan-zip

jobs:
  test-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Band 2 through neutral raw proxy
        shell: bash
        run: |
          set -euo pipefail
          target='https://www.berlin.de/sen/finanzen/haushalt/downloads/haushaltsplan-2026-27/band02_2026_2027_epl-01-02-20-21-22.pdf?ts=1777462467'
          enc=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$target")
          mkdir -p out
          curl --fail --location --silent --show-error --retry 6 --retry-all-errors --max-time 600 \
            "https://api.allorigins.win/raw?url=$enc" \
            -o out/Band_02_Einzelplaene_01_02_20_21_22.pdf
          file out/Band_02_Einzelplaene_01_02_20_21_22.pdf
          ls -lh out/Band_02_Einzelplaene_01_02_20_21_22.pdf
          test "$(head -c 4 out/Band_02_Einzelplaene_01_02_20_21_22.pdf)" = '%PDF'
          test "$(stat -c%s out/Band_02_Einzelplaene_01_02_20_21_22.pdf)" -gt 1000000

      - name: Upload verified test PDF
        uses: actions/upload-artifact@v4
        with:
          name: band-02-proxy-test
          path: out/*.pdf
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
