name: Temporary Berlin household plan ZIP

on:
  push:
    branches:
      - tmp-haushaltsplan-zip

jobs:
  test-render-proxies:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: 'melih-02', proxy: 'melih', name: 'Band_02.pdf', min_size: 1000000, url: 'https://www.berlin.de/sen/finanzen/haushalt/downloads/haushaltsplan-2026-27/band02_2026_2027_epl-01-02-20-21-22.pdf?ts=1777462467' }
          - { key: 'melih-05', proxy: 'melih', name: 'Band_05.pdf', min_size: 5000000, url: 'https://www.berlin.de/sen/finanzen/haushalt/downloads/haushaltsplan-2026-27/band05_2026_2027_epl-05.pdf?ts=1777462474' }
          - { key: 'zach-02', proxy: 'zach', name: 'Band_02.pdf', min_size: 1000000, url: 'https://www.berlin.de/sen/finanzen/haushalt/downloads/haushaltsplan-2026-27/band02_2026_2027_epl-01-02-20-21-22.pdf?ts=1777462467' }
          - { key: 'zach-05', proxy: 'zach', name: 'Band_05.pdf', min_size: 5000000, url: 'https://www.berlin.de/sen/finanzen/haushalt/downloads/haushaltsplan-2026-27/band05_2026_2027_epl-05.pdf?ts=1777462474' }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download through alternate proxy
        shell: bash
        env:
          TARGET: ${{ matrix.url }}
          NAME: ${{ matrix.name }}
          MIN_SIZE: ${{ matrix.min_size }}
          PROXY: ${{ matrix.proxy }}
        run: |
          set -euo pipefail
          mkdir -p out
          enc=$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["TARGET"], safe=""))')
          if [ "$PROXY" = melih ]; then
            fetch="https://corsproxy-8uo5.onrender.com/?url=$enc"
          else
            fetch="https://corsproxy-latest.onrender.com/$TARGET"
          fi
          echo "Proxy: $PROXY"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 30 --max-time 240 "$fetch" -o "out/$NAME"
          file "out/$NAME"
          ls -lh "out/$NAME"
          test "$(head -c 4 "out/$NAME")" = '%PDF'
          test "$(stat -c%s "out/$NAME")" -gt "$MIN_SIZE"
      - name: Upload verified PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}
          path: out/*.pdf
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
