name: VFA13 redirect probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'vfa13/capture-live-source-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Trace VFA13 redirects
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://vfa13-klassenportal.pages.dev/' \
            'https://vfa13-klassenportal.pages.dev/index.html' \
            'https://vfa13-klassenportal.pages.dev/v2' \
            'https://vfa13-klassenportal.pages.dev/api/calendar?from=2026-08-01&to=2026-09-30' \
            'https://8ec05961.vfa13-klassenportal.pages.dev/' \
            'https://8ec05961.vfa13-klassenportal.pages.dev/api/calendar?from=2026-08-01&to=2026-09-30'; do
            echo "=== $url ==="
            curl -sS --max-time 20 --max-redirs 0 -D - -o /tmp/body "$url" || true
            echo "BODY_BYTES=$(wc -c < /tmp/body 2>/dev/null || echo 0)"
            head -c 220 /tmp/body 2>/dev/null | tr '\n\r\t' ' ' || true
            echo; echo
          done
          echo '=== FOLLOW ROOT ==='
          curl -sS -L --max-time 30 --max-redirs 12 -D - -o /tmp/follow -w '\nFINAL=%{url_effective} CODE=%{http_code} REDIRS=%{num_redirects}\n' 'https://vfa13-klassenportal.pages.dev/' || true
