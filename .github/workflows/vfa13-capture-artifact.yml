name: VFA13 v2 runtime probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'vfa13/capture-live-source-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe current VFA13 V2 endpoints
        shell: bash
        run: |
          set -euo pipefail
          base='https://vfa13-klassenportal.pages.dev'
          for path in '/api/v2/health' '/api/v2/public' '/api/calendar?from=2026-08-01&to=2026-09-30'; do
            echo "=== GET $path ==="
            curl -sS --max-time 20 -D /tmp/h -o /tmp/b -w 'HTTP=%{http_code}\n' "$base$path" || true
            tr -d '\r' < /tmp/h | grep -Ei '^(content-type|x-vfa13-upgrade|x-vfa13-legacy-proxy|retry-after):' || true
            cat /tmp/b; echo; echo
          done
          echo '=== REGISTER validation probe (no account creation expected) ==='
          curl -sS --max-time 20 -D /tmp/h -o /tmp/b -w 'HTTP=%{http_code}\n' \
            -H 'content-type: application/json' \
            --data '{"display_name":"x","email":"not-an-email","password":"x","password_confirm":"y"}' \
            "$base/api/v2/auth/register" || true
          tr -d '\r' < /tmp/h | grep -Ei '^(content-type|x-vfa13-upgrade|retry-after):' || true
          cat /tmp/b; echo
