name: Klassenportal CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['release-check/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klassenportal-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Full regression suite
        run: npm test
      - name: Validate browser JavaScript syntax
        run: find public -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Release checks
        run: node scripts/release-check.mjs
      - name: Validate all D1 migrations locally
        run: npx wrangler d1 migrations apply DB --local
      # Dieser Lauf faehrt den echten Worker gegen eine echt migrierte D1 und pruefte damit
      # bereits Oberflaechen, Anmeldegrenzen, Zahlungs-Freeze und den Angebotsweg - nur hat ihn
      # nichts gestartet: er stand in package.json, aber in keinem Workflow. Ungelaufen ist er
      # verfallen (jede .html-Antwort galt als "leer ausgeliefert", weil der Asset-Dienst auf die
      # kanonische Form weiterleitet). Er laeuft jetzt im Pflichtgate mit.
      - name: Local Worker and migrated D1 runtime acceptance
        run: npm run test:commercial-worker-onboarding
