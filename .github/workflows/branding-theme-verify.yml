name: Branding theme verify
on:
  push:
    branches:
      - branding-theme-studio
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: find public -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm test
      - run: node scripts/release-check.mjs
      - run: npx wrangler d1 migrations apply DB --local
      - name: Persist success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          payload=$(jq -nc --arg status success --arg sha "$GITHUB_SHA" --arg at "$verified_at" '{status:$status,verified_sha:$sha,verified_at:$at}')
          encoded=$(printf '%s\n' "$payload" | base64 -w0)
          meta=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/ci/branding-theme.json?ref=branding-verification-status")
          current_sha=$(jq -r '.sha' <<<"$meta")
          jq -n --arg message "Record branding verification for $GITHUB_SHA" --arg content "$encoded" --arg sha "$current_sha" --arg branch branding-verification-status '{message:$message,content:$content,sha:$sha,branch:$branch}' > /tmp/status.json
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/ci/branding-theme.json" --data-binary @/tmp/status.json >/dev/null
