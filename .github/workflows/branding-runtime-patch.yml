name: Apply branding runtime schema patch
on:
  push:
    branches: [branding-runtime-schema-safety]
    paths: [patches/branding-runtime-schema.py]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branding-runtime-schema-safety
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python patches/branding-runtime-schema.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src scripts
          git diff --cached --quiet && exit 0
          git commit -m "Make six-color branding schema self-healing at runtime"
          git push origin HEAD:branding-runtime-schema-safety
