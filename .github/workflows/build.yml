name: Build check

on:
  push:
    branches: [main, commerce-model, timetable-update-review, payments-stripe]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript build
        run: npm run build
      - name: Browser JavaScript syntax
        run: find public -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Automated tests
        run: node tests/run.mjs
      - name: D1 migrations locally
        run: npx wrangler d1 migrations apply DB --local
