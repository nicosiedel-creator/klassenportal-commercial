name: Temporary live release verification

on:
  push:
    branches: [fix/pilot-offer-acceptance-foreign-key]

permissions:
  contents: read

jobs:
  verify-live-release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify production release is active through Chromium
        shell: bash
        env:
          BASE: https://klassenportal.app
          EXPECTED_SHA: 0faee4fe227dfbd9f363494e9f0d3afe28a4f440
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const base=process.env.BASE;
          const expected=process.env.EXPECTED_SHA;
          const browser=await chromium.launch({headless:true,args:['--disable-blink-features=AutomationControlled']});
          try{
            const context=await browser.newContext({
              locale:'de-DE',
              userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36',
              viewport:{width:1440,height:1000},
            });
            const page=await context.newPage();
            let response=await page.goto(`${base}/?post_release_verify=2`,{waitUntil:'domcontentloaded',timeout:60000});
            if(!response||response.status()!==200)throw new Error(`ROOT_STATUS_${response?.status()??'NONE'}`);
            const marker=await page.locator('meta[name="kp-build-commit"]').getAttribute('content');
            if(marker!==expected)throw new Error(`COMMIT_MISMATCH:${marker||'MISSING'}:${expected}`);

            for(const path of ['/produkt','/kunden-admin','/dozentenportal']){
              response=await page.goto(`${base}${path}?post_release_verify=2`,{waitUntil:'domcontentloaded',timeout:60000});
              if(!response||response.status()!==200)throw new Error(`${path}_STATUS_${response?.status()??'NONE'}`);
              const body=(await page.locator('body').innerText()).trim();
              if(!body)throw new Error(`${path}_EMPTY_BODY`);
              if(/noch nicht für den Produktivbetrieb freigegeben/i.test(body))throw new Error(`${path}_STILL_RELEASE_LOCKED`);
            }

            response=await page.goto(`${base}/api/public/product?post_release_verify=2`,{waitUntil:'domcontentloaded',timeout:60000});
            if(!response||response.status()!==200)throw new Error(`PRODUCT_API_STATUS_${response?.status()??'NONE'}`);
            const data=JSON.parse(await page.locator('body').innerText());
            if(data?.ok!==true)throw new Error('PRODUCT_API_NOT_OK');
            console.log(`LIVE_RELEASE_ACTIVE:${expected}`);
          } finally {
            await browser.close();
          }
          NODE
