name: Ops live deployment probe

on:
  push:
    branches: [ops/cloudflare-release-b84]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe production through Chromium
        shell: bash
        env:
          EXPECTED_SHA: b84d65d26fd5d66e57e6d18a4ee7c6c6a6b7133f
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const expected=process.env.EXPECTED_SHA;
          const browser=await chromium.launch({headless:true,args:['--disable-blink-features=AutomationControlled']});
          const context=await browser.newContext({
            locale:'de-DE',
            userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36',
            viewport:{width:1440,height:1000},
          });
          const page=await context.newPage();
          const base='https://klassenportal.app';
          const landing=await page.goto(base,{waitUntil:'domcontentloaded',timeout:60000});
          console.log('landing',landing?.status(),await page.title(),page.url());
          await page.waitForTimeout(5000);
          const result=await page.evaluate(async()=>{
            const r=await fetch(`/build-meta.json?same_origin_probe=${Date.now()}`,{cache:'no-store',credentials:'same-origin',headers:{accept:'application/json'}});
            const text=await r.text();
            return {status:r.status,url:r.url,contentType:r.headers.get('content-type'),text};
          });
          console.log('meta-status',result.status);
          console.log('meta-url',result.url);
          console.log('meta-content-type',result.contentType);
          console.log('meta-body',result.text.slice(0,1200));
          let commit='';
          try{commit=JSON.parse(result.text).commit||'';}catch{}
          console.log('deployed-commit',commit||'UNREADABLE');
          if(commit!==expected){
            console.error(`EXPECTED_DEPLOYMENT_NOT_OBSERVED:${expected}:${commit||'UNREADABLE'}`);
            process.exitCode=23;
          }
          await browser.close();
          NODE
