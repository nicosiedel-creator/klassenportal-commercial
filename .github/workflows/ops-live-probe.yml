name: Ops live deployment probe

on:
  push:
    branches: [ops/cloudflare-release-b84]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe production through Chromium
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--disable-blink-features=AutomationControlled']});
          const context=await browser.newContext({
            locale:'de-DE',
            userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36',
            viewport:{width:1440,height:1000},
          });
          const page=await context.newPage();
          const base='https://klassenportal.app';
          for(const path of ['/','/plattform-admin','/produkt','/kunden-admin','/dozentenportal']){
            const r=await page.goto(base+path,{waitUntil:'domcontentloaded',timeout:60000});
            console.log('NAV',path,r?.status(),await page.title(),page.url());
            await page.waitForTimeout(1200);
          }
          await page.goto(base+'/',{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(1500);
          const probes=await page.evaluate(async()=>{
            const specs=[
              ['/api/platform/onboarding-invitations','GET'],
              ['/api/onboarding/not-a-real-token','GET'],
              ['/api/payments/checkout-status?session_id=cs_test_release_freeze','GET'],
              ['/api/payments/stripe/webhook','POST'],
            ];
            const out=[];
            for(const [path,method] of specs){
              const r=await fetch(path,{method,cache:'no-store',credentials:'same-origin',headers:method==='POST'?{'content-type':'application/json'}:undefined,body:method==='POST'?'{}':undefined});
              const text=await r.text();
              out.push({path,method,status:r.status,contentType:r.headers.get('content-type'),body:text.slice(0,500)});
            }
            return out;
          });
          for(const p of probes)console.log('FETCH',JSON.stringify(p));
          await browser.close();
          NODE
