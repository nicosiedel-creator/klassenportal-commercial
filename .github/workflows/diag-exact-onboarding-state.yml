name: Diagnostic exact onboarding state

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read non-sensitive production state flags
        shell: bash
        run: |
          set -euo pipefail
          url='https://34598c07-klassenportal-commercial.nicosiedel.workers.dev/__diag/onboarding/6d5c8da4b5e64c83927d9cd6dbe74ec2'
          code=$(curl -sS --max-time 30 -o /tmp/state.json -w '%{http_code}' "$url")
          echo "HTTP=$code"
          cat /tmp/state.json
          echo
          test "$code" = 200
          jq -e '.found != null and .status != null' /tmp/state.json >/dev/null
