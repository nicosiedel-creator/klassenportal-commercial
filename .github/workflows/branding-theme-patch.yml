name: Apply branding theme patch
on:
  push:
    branches:
      - branding-theme-studio
    paths:
      - patches/apply-branding-theme.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branding-theme-studio
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python patches/apply-branding-theme.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src public scripts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete six-color branding theme studio"
          git push origin HEAD:branding-theme-studio
